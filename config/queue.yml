<% require 'lib/app_utils' %>
default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues:
        - critical
        - high
        - <%= AppUtils.host_queue_name %>
        - default
        - yeet
      threads: <%= ENV.fetch("RAILS_QUEUE_THREADS") { 2 } %>
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 0.1

development:
  <<: *default

test:
  <<: *default

staging:
  <<: *default

beta:
  <<: *default

# lab had no section either, so it has been running on Solid Queue's own defaults --
# queues: "*", threads: 3 -- rather than this file's ordered queue list and the
# RAILS_QUEUE_THREADS / JOB_CONCURRENCY tuning. Pre-existing; corrected here because
# beta would otherwise have quietly joined it.
lab:
  <<: *default

production:
  <<: *default
