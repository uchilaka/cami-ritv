<% require 'lib/app_utils' %>
default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues:
        - critical
        - high
        - <%= AppUtils.host_queue_name %>
        - default
        - yeet
      threads: <%= ENV.fetch("RAILS_QUEUE_THREADS") { 2 } %>
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 0.1

development:
  <<: *default

test:
  <<: *default

staging:
  <<: *default

beta:
  <<: *default

# Every environment needs a section. Without one Solid Queue silently falls back to its
# own defaults (queues "*", 3 threads), dropping the queue priority above and ignoring
# RAILS_QUEUE_THREADS -- lab ran that way until LAR-368. spec/queue_configuration_spec.rb
# enforces this for each file in config/environments/.
lab:
  <<: *default

production:
  <<: *default
