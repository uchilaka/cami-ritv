<% require 'lib/app_utils' %>
default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues:
        - critical
        - high
        - <%= AppUtils.host_queue_name %>
        - default
        - yeet
      threads: <%= ENV.fetch("RAILS_QUEUE_THREADS") { 2 } %>
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 0.1

development:
  <<: *default

test:
  <<: *default

staging:
  <<: *default

beta:
  <<: *default

# NOTE: lab has no section here either, and predates this branch -- it has been running
# on Solid Queue's own defaults. Tracked in LAR-368 rather than fixed here, so a live
# environment's worker config does not change inside a beta-enablement PR.

production:
  <<: *default
