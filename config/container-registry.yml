shared: &shared
  aliases:

lab: &lab
  <<: *shared
  aliases:
    crm: <%= ENV.fetch('CONTAINER_REGISTRY_HOST') %>/twenty-crm-<%= ENV.fetch('RAILS_ENV') %>
    web: <%= ENV.fetch('CONTAINER_REGISTRY_HOST') %>/cami-web-<%= ENV.fetch('RAILS_ENV') %>
    worker: <%= ENV.fetch('CONTAINER_REGISTRY_HOST') %>/cami-worker-<%= ENV.fetch('RAILS_ENV') %>

development:
  <<: *lab

test:
  aliases:
    crm: <%= ENV.fetch('CONTAINER_REGISTRY_HOST') %>/twenty-crm
    web: <%= ENV.fetch('CONTAINER_REGISTRY_HOST') %>/<%= ENV.fetch('CONTAINER_NAME_PREFIX') %>-web
    worker: <%= ENV.fetch('CONTAINER_REGISTRY_HOST') %>/<%= ENV.fetch('CONTAINER_NAME_PREFIX') %>-worker

beta:
  <<: *lab

# Staging deliberately shares the lab images: both front the same beta environment
# (accounts.beta.larcity.tech) and are promoted together.
staging:
  <<: *lab

# Aliases MUST be declared explicitly here. Inheriting `<<: *lab` would silently
# resolve production to the *-lab repositories and deploy lab images to production.
#
# NOTE: fly.toml builds a single image (Dockerfile.web) and runs both the `web` and
# `worker` process groups from it, so the worker alias is only used by deploy targets
# that build Dockerfile.worker separately. See LAR-325.
production:
  <<: *shared
  aliases:
    crm: <%= ENV.fetch('CONTAINER_REGISTRY_HOST') %>/twenty-crm-production
    web: <%= ENV.fetch('CONTAINER_REGISTRY_HOST') %>/cami-web-production
    worker: <%= ENV.fetch('CONTAINER_REGISTRY_HOST') %>/cami-worker-production
